<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=width-device, initial-scale=1">
    <title>TDC Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Club Member Login</h1>
        <form method="POST" action="/login">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password"><br>
            </div>
            <button type="submit" name="login" class="btn btn-primary">Login</button>
        </form>
    </div>

    <!-- Footer -->
	<footer class="tdc-footer">
		<div class="container d-flex flex-wrap justify-content-between align-items-center">
			<div class="tdc-brand" style="font-size: 1.05rem;">THA <span style="color: var(--tdc-gold);">DUB</span> CLUB</div>
			<div>
				<a href="https://twitch.tv/SlimDuncantdc">Twitch</a>
				<a href="https://discord.gg/768zjNapB">Discord</a>
				<a href="#roster">Members</a>
			</div>
		</div>
		<div class="container mt-2" style="font-size: 0.75rem;">&copy; 2026 Tha Dub Club. Catch a dub.</div>
	</footer>

</body>
</html>
